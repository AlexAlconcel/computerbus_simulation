<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Bus Simulator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <h1>COMPUTER BUS SIMULATOR</h1>
        <p>Computer Architecture and Organization</p>
      </div>
    </header>

    <main class="layout">
      <section class="card">
        <h2>Bus Configuration</h2>
        <form id="configForm" novalidate>
          <div class="grid-2">
            <label>
              Source Device
              <select id="source" required>
                <option value="CPU">CPU</option>
                <option value="RAM">RAM</option>
                <option value="Storage">Storage</option>
                <option value="I/O">I/O Device</option>
              </select>
            </label>
            <label>
              Destination Device
              <select id="destination" required>
                <option value="CPU">CPU</option>
                <option value="RAM" selected>RAM</option>
                <option value="Storage">Storage</option>
                <option value="I/O">I/O Device</option>
              </select>
            </label>
            <label>
              Operation
              <select id="operation" required>
                <option value="Read">Read</option>
                <option value="Write">Write</option>
              </select>
            </label>
            <label>
              Bus Width
              <select id="busWidth" required>
                <option value="8">8 bits</option>
                <option value="16" selected>16 bits</option>
                <option value="32">32 bits</option>
                <option value="64">64 bits</option>
              </select>
            </label>
            <label>
              Transfer Rate (million transfers/s)
              <input id="transferRate" type="number" min="0.01" step="0.01" value="100" required>
            </label>
            <label>
              Data Size (bytes)
              <input id="dataSize" type="number" min="1" step="1" value="1024" required>
            </label>
          </div>

          <p id="formError" class="error" hidden></p>

          <button type="submit" class="primary" id="simulateBtn">
            Simulate Data Transfer
          </button>
        </form>
      </section>

      <aside class="stack">
        <section class="card">
          <h2>Transfer Result</h2>
          <div class="metrics">
            <div>
              <span class="muted">Estimated Bandwidth</span>
              <strong id="bandwidthValue">—</strong>
            </div>
            <div>
              <span class="muted">Estimated Transfer Time</span>
              <strong id="timeValue">—</strong>
            </div>
          </div>
          <dl class="result-grid" id="resultDetails">
            <div><dt>Source</dt><dd id="resSource">—</dd></div>
            <div><dt>Destination</dt><dd id="resDest">—</dd></div>
            <div><dt>Address</dt><dd id="resAddress">—</dd></div>
            <div><dt>Data size</dt><dd id="resSize">—</dd></div>
          </dl>
        </section>

        <section class="card">
          <h2>Recent Transactions</h2>
          <div id="history" class="history">
            <p class="muted">No transfers yet. Run a simulation to log activity on the bus.</p>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script src="js/simulator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
